services:
  npm: &npm
    image: node:22
    working_dir: /app
    user: '${UID:-1000}:${GID:-1000}'
    volumes:
      - .:/app
      - ${SSH_AUTH_SOCK:-no-agent}:/ssh-agent
      - .npmrc:/home/node/.npmrc
    entrypoint: [ npm ]

  storybook:
    <<: *npm
    command: [ run, storybook, --, --no-open ]
    ports:
      - "6006:6006"

volumes:
  no-agent:
    driver: local
